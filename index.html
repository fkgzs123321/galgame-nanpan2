<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
#gg2{--bg0:#0a0c11;--bg1:#11151d;--line:#28303d;--ink:#d6dded;--dim:#78829a;--faint:#4e5769;
  --gold:#e8b84b;--grn:#7ec8a0;--rose:#e07a9a;--blu:#8fb8d8;--pur:#d8a0e0;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg0));border:1px solid var(--line);
  border-radius:12px;padding:0;margin:10px 0;font-size:13px;line-height:1.7;overflow:hidden}
#gg2 .hd{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#0d1119;border-bottom:1px solid var(--line)}
#gg2 .hd .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#gg2 .hd .t{font-size:13.5px;font-weight:700;color:#e3e9f5}
#gg2 .hd .s{color:var(--dim);font-size:11px;margin-left:auto}
#gg2 .bd{padding:10px 13px}
#gg2 h5{margin:10px 0 6px;font-size:11.5px;font-weight:600;color:var(--faint);letter-spacing:.6px;
  border-bottom:1px dashed #232b38;padding-bottom:3px}
#gg2 h5:first-child{margin-top:0}
#gg2 .bars{display:flex;flex-wrap:wrap;gap:5px 15px}
#gg2 .bar{display:flex;align-items:center;gap:6px}
#gg2 .bar .lb{color:var(--dim);font-size:11.5px;min-width:34px}
#gg2 .tk{display:inline-block;position:relative;height:6px;width:76px;border-radius:3px;background:#1b2130;overflow:hidden;flex:0 0 auto}
#gg2 .tk>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .3s}
#gg2 .tk.hp>i{background:linear-gradient(90deg,#a05252,#e07a7a)}
#gg2 .tk.re>i{background:linear-gradient(90deg,#4a6fa0,#8fb8d8)}
#gg2 .tk.ex>i{background:linear-gradient(90deg,#8a5aa0,#d8a0e0)}
#gg2 .tk.mo>i{background:linear-gradient(90deg,#5a7a4a,#9fd07a)}
#gg2 .bar .vv{font-variant-numeric:tabular-nums;font-weight:600;min-width:24px;text-align:right;font-size:12.5px}
#gg2 .chips{display:flex;flex-wrap:wrap;gap:4px}
#gg2 .chip{background:#1a2029;border:1px solid #262e3a;border-radius:5px;padding:0 6px;font-size:11px;color:#98a2b6}
#gg2 .chip b{color:#cfd7e6;margin-left:3px;font-variant-numeric:tabular-nums}
#gg2 .box{background:rgba(232,184,75,.05);border:1px solid rgba(232,184,75,.22);border-radius:8px;padding:7px 9px;font-size:12px}
#gg2 .box.pink{background:rgba(224,122,154,.06);border-color:rgba(224,122,154,.25)}
#gg2 .row{display:flex;gap:6px;margin-bottom:2px}
#gg2 .row .k{color:var(--dim);flex:0 0 56px;font-size:11.5px}
#gg2 .row .v{flex:1;font-size:12px;color:#dfe6f2}
#gg2 .row .v.hi{color:var(--gold)}
#gg2 details{margin-top:7px;border:1px solid #232b38;border-radius:8px;background:#0f141c}
#gg2 details>summary{cursor:pointer;padding:5px 9px;font-size:11.5px;color:#8d97ab;list-style:none;user-select:none}
#gg2 details>summary::-webkit-details-marker{display:none}
#gg2 details>summary:before{content:'▸ ';color:var(--faint)}
#gg2 details[open]>summary:before{content:'▾ '}
#gg2 details>summary .n{color:var(--gold)}
#gg2 .girls{padding:4px 9px 8px}
#gg2 .g{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:1px 0}
#gg2 .g .nm{min-width:68px;color:#c2cbdc}
#gg2 .g .st{min-width:40px;font-size:10.5px;padding:0 5px;border-radius:4px;text-align:center;
  background:#1a2029;border:1px solid #262e3a;color:#8d97ab}
#gg2 .g .st.熟{color:var(--blu);border-color:#2b4a63}
#gg2 .g .st.依{color:var(--grn);border-color:#2b4a37}
#gg2 .g .st.恋{color:var(--rose);border-color:#4a2632}
#gg2 .g .tk{width:auto;flex:1;max-width:150px}
#gg2 .g .af{font-variant-numeric:tabular-nums;color:#98a2b6;min-width:32px;text-align:right}
#gg2 .opts{display:flex;flex-direction:column;gap:5px}
#gg2 .opt{display:flex;align-items:flex-start;gap:8px;background:#141a24;border:1px solid #232b38;
  border-radius:8px;padding:6px 9px;transition:.14s}
#gg2 .opt.she{border-color:var(--gold);background:rgba(232,184,75,.06)}
#gg2 .opt .no{width:18px;height:18px;border-radius:4px;background:#1c2330;color:var(--gold);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
#gg2 .opt.she .no{background:var(--gold);color:#1a1408}
#gg2 .opt .tx{flex:1;font-size:12px;line-height:1.55}
#gg2 .opt .lv{font-size:10px;padding:0 5px;border-radius:4px;background:#1a2029;border:1px solid #262e3a;color:#8d97ab;flex:0 0 auto}
#gg2 .opt .lv.mid{color:var(--blu);border-color:#2b4a63}
#gg2 .opt .lv.strong{color:var(--pur);border-color:#4a2b63}
#gg2 .opt .lv.extreme{color:var(--rose);border-color:#4a2632}
#gg2 .opt .rj{font-size:10.5px;padding:1px 8px;border-radius:5px;cursor:pointer;border:1px solid #4a2632;
  background:#221318;color:var(--rose);flex:0 0 auto;font-family:inherit}
#gg2 .opt .rj:hover:not(:disabled){background:#2e1a20}
#gg2 .opt .rj:disabled{border-color:#262d38;background:#181d24;color:#4a5361;cursor:not-allowed}
#gg2 .tip{margin-top:5px;font-size:10.5px;color:var(--faint);font-style:italic}
#gg2 .res{margin-top:6px;padding:6px 9px;border-radius:7px;font-size:11.5px;display:none}
#gg2 .res.on{display:block}
#gg2 .res.ok{border:1px solid #2b4a37;background:#16221b;color:#8fd0a8}
#gg2 .res.no{border:1px solid #4a2632;background:#221318;color:#e8a0a0}
</style>
</head>
<body>
<div id="gg2">
  <div class="hd"><span class="dot"></span><span class="t">读取中…</span></div>
  <div class="bd"></div>
</div>
<script>
(function () {
  var NS = 'gg2';
  var 等级 = { 微:{c:[3,5],r:90,k:'micro'}, 中:{c:[10,15],r:60,k:'mid'}, 强:{c:[25,35],r:30,k:'strong'},
               极:{c:[50,60],r:10,k:'extreme'}, 锁:{c:null,r:0,k:'lock'} };
  var 英中 = { micro:'微', mid:'中', strong:'强', extreme:'极', lock:'锁' };
  function 归(v){v=String(v||'');return 等级[v]?v:(英中[v]||'微');}
  function 数(v,d){var n=Number(v);return isFinite(n)?n:(d||0);}
  function 夹(v,a,b){return Math.max(a,Math.min(b,v));}
  function E(s){return String(s===undefined||s===null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function 有(v){return v!==undefined&&v!==null&&String(v).trim()!=='';}
  function 键(o){try{return Object.keys(o||{}).filter(function(k){return 有(o[k])||typeof o[k]==='object';});}catch(e){return [];}}
  function 阶段类(s){s=String(s||'');if(/恋|爱|依/.test(s))return '恋';if(/熟|亲近|友好/.test(s))return '熟';return '';}

  function 取数据(楼){
    try{var v=getVariables({type:'message',message_id:楼});if(v&&v.stat_data&&v.stat_data.主角)return v.stat_data;}catch(e){}
    try{if(typeof Mvu!=='undefined'&&Mvu.getMvuData){var m=Mvu.getMvuData({type:'message',message_id:楼});
      if(m&&m.stat_data&&m.stat_data.主角)return m.stat_data;}}catch(e){}
    return null;
  }
  /* 优先找「局面.当前选项 有内容」的最近楼层 */
  function 最好楼层(){
    var last=0;
    try{last=getLastMessageId();}catch(e){try{if(typeof chat!=='undefined')last=chat.length-1;}catch(e2){}}
    var 兜底=null;
    for(var i=last;i>=0&&i>last-25;i--){
      var sd=取数据(i);if(!sd)continue;
      if(!兜底)兜底={楼:i,d:sd};
      var o=(sd.局面&&sd.局面.当前选项)||{};
      if(键(o).length) return {楼:i,d:sd};
    }
    return 兜底;
  }

  function 画(d){
    var t=d.时间||{},sc=d.场景||{},p=d.主角||{},she=d.她||{},ec=d.经济||{},ws=d.世界||{},局=d.局面||{};
    var 面=局.场面||{}, 女角=d.女角||ws.女角||{};
    var H='';

    H+='<div class="hd"><span class="dot"></span><span class="t">第 '+数(t.天数,1)+' 天 · '+E(t.当前日期||'—')+'</span>'
      +'<span class="s">'+E([t.章节,sc.场景模式,t.天气].filter(Boolean).join(' · '))+'</span></div><div class="bd">';

    var 条=[['体力',p.身体状态,'hp'],['反抗',p.反抗值,'re'],['兴奋',she.兴奋度!==undefined?she.兴奋度:d.兴奋度,'ex'],['心情',p.心情,'mo']];
    H+='<h5>'+E(p.状态||'在线')+' · 你</h5><div class="bars">';
    for(var i=0;i<条.length;i++){var v=夹(数(条[i][1]),0,100);
      H+='<span class="bar"><span class="lb">'+条[i][0]+'</span><span class="tk '+条[i][2]+'"><i style="width:'+v+'%"></i></span><span class="vv">'+v+'</span></span>';}
    H+='</div>';

    var sk=p.技能||{};
    H+='<div class="chips" style="margin-top:6px">'
      +'<span class="chip">说话<b>'+数(p.说话)+'</b></span><span class="chip">做事<b>'+数(p.做事)+'</b></span>'
      +'<span class="chip">懂东西<b>'+数(p.懂东西)+'</b></span><span class="chip">打工<b>'+数(sk.打工)+'</b></span>'
      +'<span class="chip">学业<b>'+数(sk.学业)+'</b></span><span class="chip">机车<b>'+数(sk.机车)+'</b></span>'
      +'<span class="chip">现金<b>'+数(ec.现金)+'</b></span><span class="chip">储蓄<b>'+数(ec.累计储蓄)+'</b></span>'
      +'<span class="chip">了解<b>'+数(p.对她的了解)+'</b></span></div>';

    H+='<h5>屏幕外的她</h5><div class="box pink">'
      +'<div class="row"><span class="k">人设</span><span class="v hi">'+E(she.人设||'—')+'　熟练度 '+数(she.熟练度)+'　情绪 '+E(she.情绪||'—')+'</span></div>'
      +'<div class="row"><span class="k">目的</span><span class="v">进度 '+数(she.目的进度)+'%　已拿到 '+数(she.已拿到)+'</span></div>';
    if(有(she.此刻)) H+='<div class="row"><span class="k">她此刻</span><span class="v">'+E(she.此刻)+'</span></div>';
    if(有(局.她打的字)) H+='<div class="row"><span class="k">正在打</span><span class="v">'+E(局.她打的字)+'</span></div>';
    if(有(局.她的倾向)) H+='<div class="row"><span class="k">她的倾向</span><span class="v">倾向第 '+E(局.她的倾向)+' 条</span></div>';
    H+='</div>';

    if(有(面.地点)||有(面.体位)||有(面.节奏)||有(面.留痕)){
      H+='<h5>场面</h5><div class="box">';
      if(有(面.地点)) H+='<div class="row"><span class="k">地点</span><span class="v">'+E(面.地点)+'</span></div>';
      if(有(面.体位)) H+='<div class="row"><span class="k">体位</span><span class="v">'+E(面.体位)+'</span></div>';
      if(有(面.节奏)) H+='<div class="row"><span class="k">节奏</span><span class="v">'+E(面.节奏)+'</span></div>';
      var 参=键(面.参与); if(参.length) H+='<div class="row"><span class="k">参与</span><span class="v">'+E(参.join('、'))+'</span></div>';
      if(有(面.留痕)) H+='<div class="row"><span class="k">留痕</span><span class="v">'+E(面.留痕)+'</span></div>';
      if(有(面.她看到的)) H+='<div class="row"><span class="k">她看到</span><span class="v">'+E(面.她看到的)+'</span></div>';
      H+='</div>';
    }

    var 名=键(女角);
    if(名.length){
      var 活=名.filter(function(n){var o=女角[n]||{};return 数(o.好感度)||数(o.开发度);});
      H+='<details'+(活.length?' open':'')+'><summary>女角<span class="n"> '+名.length+' </span>位'+(活.length?'（有进展 '+活.length+'）':'（都还没动）')+'</summary><div class="girls">';
      for(var g=0;g<名.length;g++){
        var o=女角[名[g]]||{};
        var af=数(o.好感度!==undefined?o.好感度:o.开发度,0);
        var st=E(o.关系阶段||o.关系||'—');
        H+='<div class="g"><span class="nm">'+E(名[g])+'</span><span class="st '+阶段类(st)+'">'+st+'</span>'
          +'<span class="tk re"><i style="width:'+夹((af+100)/2,0,100)+'%"></i></span><span class="af">'+(af>0?'+':'')+af+'</span>'
          +(数(o.开发度)?'<span class="af" style="color:#d8a0e0">开'+数(o.开发度)+'</span>':'')+'</div>';
        var 细=[];
        if(有(o.状态)) 细.push(E(o.状态));
        if(有(o.身体记忆)) 细.push('记得：'+E(o.身体记忆));
        var 器=[['胸',o.胸],['阴',o.阴部],['后',o.后穴]];
        for(var q=0;q<器.length;q++){var v=器[q][1]||{};
          if(数(v.开发度)||有(v.现状)) 细.push('【'+器[q][0]+'】'+数(v.开发度)+(v.破瓜?' 已破':'')+(有(v.现状)?'　'+E(v.现状):''));}
        if(有(o.已封死)) 细.push('已封死：'+E(o.已封死));
        if(细.length) H+='<div class="g"><span class="nm"></span><span style="flex:1;font-size:10.5px;color:#6b7484;line-height:1.6">'+细.join('　·　')+'</span></div>';
      }
      H+='</div></details>';
    }

    var 选=局.当前选项||{}, 选键=键(选), 她选=String(局.她已选||'');
    H+='<h5>她摆出来的</h5>';
    if(选键.length){
      H+='<div class="opts">';
      for(var k=0;k<选键.length;k++){
        var s=选[选键[k]]||{}, lv=归(s.等级), 被选=(她选===选键[k]);
        H+='<div class="opt'+(被选?' she':'')+'" data-k="'+E(选键[k])+'">'
          +'<span class="no">'+E(选键[k])+'</span><span class="tx">'+E(s.文本||'')+'</span>'
          +'<span class="lv '+等级[lv].k+'">'+lv+(等级[lv].c?' '+等级[lv].c[0]+'~'+等级[lv].c[1]:'')+'</span>'
          +'<button class="rj" type="button" data-k="'+E(选键[k])+'">拒绝</button></div>';
      }
      H+='</div><div class="res"></div>';
      H+='<div class="tip">'+(她选?'她点了第 '+E(她选)+' 条。':'她还没点。')+'　拒绝要花反抗值，等级越高越贵、越难成。</div>';
    }else{
      H+='<div class="tip">这一层她没有摆选项。等她自己动手。</div>';
      if(有(局.今日指令)) H+='<div class="box" style="margin-top:5px"><div class="row"><span class="k">今日指令</span><span class="v">'+E(局.今日指令)+'</span></div></div>';
    }

    H+='</div>';
    return H;
  }

  var 楼=-1;
  function 刷新(){
    var r=最好楼层(); if(!r)return; 楼=r.楼;
    var 盒=document.getElementById(NS); if(!盒)return;
    盒.innerHTML=画(r.d);
    盒.setAttribute('data-'+NS+'-init','1');
    绑(盒);
  }

  function 绑(盒){
    var bs=盒.querySelectorAll('.rj');
    for(var i=0;i<bs.length;i++){
      bs[i].onclick=function(ev){
        ev.stopPropagation();
        var k=this.getAttribute('data-k');
        var sd=取数据(楼); if(!sd)return;
        var 局=sd.局面||{}, 选=局.当前选项||{}, o=选[k]||{};
        var lv=归(o.等级), 表=等级[lv], res=盒.querySelector('.res');
        if(!表.c){res.className='res on no';res.textContent='这一条锁住了，拒不了。';return;}
        var 反抗=数(sd.主角&&sd.主角.反抗值,0);
        var 耗=表.c[0]+Math.floor(Math.random()*(表.c[1]-表.c[0]+1));
        if(反抗<耗){res.className='res on no';res.textContent='反抗值不够（要 '+耗+'，你只有 '+反抗+'）。';return;}
        var 掷=Math.floor(Math.random()*100)+1, 成=掷<表.r;
        try{updateVariablesWith(function(v){
          v=v||{};if(!v.stat_data)v.stat_data={};
          var pr=v.stat_data.主角||(v.stat_data.主角={});pr.反抗值=Math.max(0,反抗-耗);
          var jj=v.stat_data.局面||(v.stat_data.局面={});jj.玩家拒绝=String(k);
          jj.判定结果={选项:String(o.文本||''),等级:lv,消耗:耗,成功率:表.r,掷值:掷,结果:成?'成功':'失败',效果倍数:成?1:0.6};
          return v;
        },{type:'message',message_id:楼});}catch(e){}
        res.className='res on '+(成?'ok':'no');
        res.textContent='拒绝了「'+(o.文本||'')+'」｜ 扣 '+耗+' · 掷 '+掷+' · 需 '+表.r+' → '+(成?'成功':'失败');
        var 全部=盒.querySelectorAll('.rj'); for(var m=0;m<全部.length;m++) 全部[m].disabled=true;
      };
    }
  }

  刷新();
  try{if(typeof eventOn==='function'&&typeof tavern_events!=='undefined'){
    [tavern_events.MESSAGE_RENDERED,tavern_events.MESSAGE_UPDATED,tavern_events.CHAT_CHANGED,tavern_events.MESSAGE_SWIPED]
      .forEach(function(t){if(t)eventOn(t,function(){setTimeout(刷新,150);});});}}catch(e){}
  try{setInterval(刷新,2000);}catch(e){}
  console.log('[gg2] 状态栏已加载');
}());
</script>
</body>
</html>
